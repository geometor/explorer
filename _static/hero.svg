        --pt-given: #f8fafc;
        --pt-found: #38bdf8;
        --pt-golden: #fbbf24;
        --halo: rgba(20, 20, 23, 0.92);
      }
    }
    .svg-bg { fill: var(--svg-bg); }
    .grid-line { stroke: var(--grid); stroke-width: 1; }
    .geom-line { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linecap: round; opacity: 0.72; }
    .geom-circle { fill: none; stroke: var(--circle); stroke-width: 2; opacity: 0.82; }
    .geom-circle.sub { stroke-width: 1.3; stroke-dasharray: 5 4; opacity: 0.52; }
    .geom-poly { fill: var(--poly-fill); stroke: var(--circle); stroke-width: 2.2; stroke-linejoin: round; }
    .geom-golden { fill: none; stroke: var(--golden); stroke-width: 3.4; stroke-linecap: round; }
    .geom-accent { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; }
    .pt-given { fill: var(--pt-given); stroke: var(--svg-bg); stroke-width: 1.5; }
    .pt-found { fill: var(--pt-found); stroke: var(--svg-bg); stroke-width: 1.4; }
    .pt-golden { fill: var(--pt-golden); stroke: var(--svg-bg); stroke-width: 1.5; }
    .lbl {
      font-size: 13px;
      font-weight: 600;
      fill: var(--ink);
      paint-order: stroke;
      stroke: var(--halo);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .caption {
      font-size: 12px;
      font-weight: 500;
      fill: var(--muted);
      letter-spacing: 0.04em;
    }
